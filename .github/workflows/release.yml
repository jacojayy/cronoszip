name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.2.3"
        required: true
        default: "v1.2.3"
        type: string
      title:
        description: "Release title"
        required: true
        default: "CronosZip v1.2.3"
        type: string
      run_id:
        description: "Build run ID to release (blank = latest successful Build APK run on main)"
        required: false
        default: ""
        type: string
      notes:
        description: "Custom release notes (blank = .github/release-notes-<tag>.md, then detailed first-release notes, then auto-generated notes)"
        required: false
        default: ""
        type: string
      draft:
        description: "Create as a draft release"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish APK release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build run
        id: build
        env:
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_RUN_ID//[[:space:]]/}" ]; then
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID=$(gh run list \
              --workflow=build.yml \
              --branch=main \
              --status=success \
              --limit=1 \
              --json=databaseId \
              --jq='.[0].databaseId // empty')
          fi

          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful Build APK run was found on main. Run the build first."
            exit 1
          fi

          gh run view "$RUN_ID" \
            --json=status,conclusion,headSha,displayTitle,createdAt,url \
            > build-run.json

          STATUS=$(jq -r '.status' build-run.json)
          CONCLUSION=$(jq -r '.conclusion' build-run.json)
          SHA=$(jq -r '.headSha' build-run.json)
          CREATED=$(jq -r '.createdAt' build-run.json)
          RUN_TITLE=$(jq -r '.displayTitle' build-run.json)
          RUN_URL=$(jq -r '.url' build-run.json)

          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::Build run $RUN_ID is $STATUS / $CONCLUSION, not a successful completed run."
            exit 1
          fi

          echo "Using build run $RUN_ID ($RUN_TITLE)"
          echo "Commit: $SHA"
          echo "Built: $CREATED"

          {
            echo "run_id=$RUN_ID"
            echo "sha=$SHA"
            echo "created=$CREATED"
            echo "run_title=$RUN_TITLE"
            echo "run_url=$RUN_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        id: apk
        env:
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          set -euo pipefail

          rm -rf dist
          gh run download "$RUN_ID" --name cronoszip-release-apk --dir dist

          APK=$(find dist -type f -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::The build run did not contain an .apk file."
            find dist -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Downloaded: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        id: assets
        env:
          TAG: ${{ inputs.tag }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'; then
            echo "::error::Tag '$TAG' must contain only letters, numbers, dots, underscores and hyphens."
            exit 1
          fi

          SAFE_TAG=$(printf '%s' "$TAG" | sed 's/[^A-Za-z0-9._-]/-/g')
          ASSET="CronosZip-${SAFE_TAG}.apk"

          cp "$APK" "$ASSET"
          sha256sum "$ASSET" > "${ASSET}.sha256"

          META=$(find dist -type f -name 'output-metadata.json' -print -quit)
          if [ -z "$META" ]; then
            echo "::error::The build run did not contain output-metadata.json."
            exit 1
          fi
          VERSION_CODE=$(python3 - "$META" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(data["elements"][0]["versionCode"])
          PY
          )
          VERSION_NAME=$(python3 - "$META" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(data["elements"][0].get("versionName", ""))
          PY
          )
          printf '%s\n' "$VERSION_CODE" > version.txt

          SIZE_BYTES=$(stat -c '%s' "$ASSET")
          SIZE_HUMAN=$(numfmt --to=iec-i --suffix=B "$SIZE_BYTES")
          SHA256=$(sha256sum "$ASSET" | awk '{print $1}')

          {
            echo "safe_tag=$SAFE_TAG"
            echo "asset=$ASSET"
            echo "version_code=$VERSION_CODE"
            echo "version_name=$VERSION_NAME"
            echo "size_bytes=$SIZE_BYTES"
            echo "size_human=$SIZE_HUMAN"
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"

          echo "Prepared $ASSET (versionName $VERSION_NAME, versionCode $VERSION_CODE, $SIZE_HUMAN, sha256 $SHA256)"

      - name: Detect first release
        id: first
        run: |
          set -euo pipefail

          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq 'length')
          if [ "$COUNT" = "0" ]; then
            echo "first=true" >> "$GITHUB_OUTPUT"
            echo "This will be the first release; the detailed first-release notes will be used."
          else
            echo "first=false" >> "$GITHUB_OUTPUT"
            echo "This is not the first release; GitHub-generated notes will be used unless custom notes are supplied."
          fi

      - name: Render release notes
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          FIRST_RELEASE: ${{ steps.first.outputs.first }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          SHA: ${{ steps.build.outputs.sha }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
          RUN_URL: ${{ steps.build.outputs.run_url }}
          BUILD_DATE: ${{ steps.build.outputs.created }}
          ASSET: ${{ steps.assets.outputs.asset }}
          APK_SIZE: ${{ steps.assets.outputs.size_human }}
          APK_SIZE_BYTES: ${{ steps.assets.outputs.size_bytes }}
          APK_SHA256: ${{ steps.assets.outputs.sha256 }}
          VERSION_CODE: ${{ steps.assets.outputs.version_code }}
          VERSION_NAME: ${{ steps.assets.outputs.version_name }}
        run: |
          set -euo pipefail

          MODE=generated
          if [ -n "${INPUT_NOTES//[[:space:]]/}" ]; then
            printf '%s\n' "$INPUT_NOTES" > release-notes.md
            MODE=custom
            echo "Using custom release notes from the workflow input."
          elif [ -f ".github/release-notes-${TAG}.md" ]; then
            cp ".github/release-notes-${TAG}.md" release-notes.md
            MODE=custom
            echo "Using .github/release-notes-${TAG}.md."
          elif [ "$FIRST_RELEASE" = "true" ]; then
            cp .github/release-notes-first.md release-notes.md
            MODE=custom
            echo "Using detailed first-release notes."
          else
            echo "Using GitHub-generated release notes."
          fi

          if [ -f release-notes.md ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path

          text = Path("release-notes.md").read_text(encoding="utf-8")
          values = {
              "{{TAG}}": os.environ.get("TAG", ""),
              "{{TITLE}}": os.environ.get("TITLE", ""),
              "{{REPO}}": os.environ.get("GITHUB_REPOSITORY", ""),
              "{{SHA}}": os.environ.get("SHA", ""),
              "{{SHORT_SHA}}": os.environ.get("SHA", "")[:7],
              "{{RUN_ID}}": os.environ.get("RUN_ID", ""),
              "{{RUN_URL}}": os.environ.get("RUN_URL", ""),
              "{{BUILD_DATE}}": os.environ.get("BUILD_DATE", ""),
              "{{ASSET}}": os.environ.get("ASSET", ""),
              "{{APK_SIZE}}": os.environ.get("APK_SIZE", ""),
              "{{APK_SIZE_BYTES}}": os.environ.get("APK_SIZE_BYTES", ""),
              "{{APK_SHA256}}": os.environ.get("APK_SHA256", ""),
              "{{VERSION_CODE}}": os.environ.get("VERSION_CODE", ""),
              "{{VERSION_NAME}}": os.environ.get("VERSION_NAME", ""),
          }
          for token, value in values.items():
              text = text.replace(token, value)
          Path("release-notes.md").write_text(text, encoding="utf-8")
          PY
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          echo "### Release notes preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f release-notes.md ]; then
            head -n 60 release-notes.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GitHub will generate notes from commits and pull requests." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub Release
        env:
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          SHA: ${{ steps.build.outputs.sha }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
          ASSET: ${{ steps.assets.outputs.asset }}
          NOTES_MODE: ${{ steps.notes.outputs.mode }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release for tag '$TAG' already exists. Pick a new tag or delete the old release first."
            exit 1
          fi

          ARGS=(
            release create "$TAG"
            "$ASSET"
            "${ASSET}.sha256"
            version.txt
            --title "$TITLE"
            --target "$SHA"
          )

          if [ "$NOTES_MODE" = "generated" ]; then
            ARGS+=(--generate-notes)
          else
            ARGS+=(--notes-file release-notes.md)
          fi

          if [ "$DRAFT" = "true" ]; then
            ARGS+=(--draft)
          fi

          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          RELEASE_URL=$(gh "${ARGS[@]}")
          echo "Created release: $RELEASE_URL"

          {
            echo "## CronosZip release published"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$SHA\`"
            echo "- Build run: [$RUN_ID](https://github.com/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID)"
            echo "- Asset: \`$ASSET\`"
            echo "- Release: $RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
