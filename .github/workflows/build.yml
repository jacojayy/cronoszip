name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK and install NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          NDK="$SDK_ROOT/ndk/27.0.12077973"
          if [ ! -d "$NDK" ]; then
            "$SDKMANAGER" --install "ndk;27.0.12077973"
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android-ndk-27

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build native libraries
        id: native
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x rust/build-android.sh
          ./rust/build-android.sh 2>&1 | tee native-build.log

      - name: Report native build failure
        if: steps.native.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("native-build.log").read_text(errors="replace")
          text = re.sub(r"\x1b\[[0-9;]*m", "", text)
          tail = "\n".join(text.splitlines()[-30:])
          print("::group::Native build tail")
          print(tail)
          print("::endgroup::")
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Native build failed::{escaped}")
          PY
          exit 1

      - name: Set up Gradle
        if: steps.native.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        id: gradle
        if: steps.native.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee gradle-build.log

      - name: Report Gradle build failure
        if: steps.gradle.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("gradle-build.log").read_text(errors="replace")
          text = re.sub(r"\x1b\[[0-9;]*m", "", text)
          tail = "\n".join(text.splitlines()[-30:])
          print("::group::Gradle build tail")
          print(tail)
          print("::endgroup::")
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build failed::{escaped}")
          PY
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cronoszip-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 14
