[package]
name = "cronoszip-jni"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "cronoszip_jni"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
hatchzip-core = { path = "../hatchzip-core", features = ["rar"] }
jni = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
