[package]
name = "hatchzip-core"
description = "The CronosZip engine, a port of HatchZip: extract ZIP, 7z, tar and RAR archives in place, freeing the archive as it goes."
version = "0.1.8"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jacojayy/cronoszip"
homepage = "https://github.com/jacojayy/cronoszip"
keywords = ["zip", "7z", "extract", "archive", "disk-space"]
categories = ["compression", "filesystem"]

[dependencies]
anyhow = "1.0.104"
crc32fast = "1.5.3"
fs4 = "1.1.0"
libz-rs-sys = "0.6.8"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "ppmd", "zstd"] }
tar = "0.4.46"
zip = "9"
unrar-ng-sys = { version = "=0.7.7", optional = true }
aes = { version = "0.9.3", optional = true }
cbc = { version = "0.2.1", optional = true }
pbkdf2 = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.1", optional = true }

[features]
default = []
rar = ["dep:unrar-ng-sys", "dep:aes", "dep:cbc", "dep:pbkdf2", "dep:sha2"]

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
